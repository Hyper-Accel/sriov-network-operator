# Use with the existing chart and both --set-file extraDeploy arguments.
# See doc/bertha-deployment.md. This profile never installs host drivers.
operator:
  clusterType: kubernetes
  nodeSelector:
    kubernetes.io/os: linux
  resourcePrefix: hyperaccel.ai
  cniBinPath: /opt/cni/bin
  admissionControllers:
    enabled: true
    certificates:
      certManager:
        enabled: true
        generateSelfSigned: true

sriovOperatorConfig:
  deploy: true
  configDaemonNodeSelector:
    kubernetes.io/os: linux
    hyperaccel.ai/thor2-planned: "true"
    hyperaccel.ai/thor2-config: "enabled"
  configurationMode: daemon
  disableDrain: false
  logLevel: 2

# Set verified image tags/digests in a site values file; do not use latest.
# Verified on node101; VF ID is advertised by both PFs' SR-IOV capability.
supportedExtraNICs:
  - 'Broadcom_BCM57608: "14e4 1760 1819"'

bertha:
  # Ethernet MTU matching the infrastructure PF baseline for RoCE MTU 4096.
  # Thor 2 switch ports use MTU 9100; host MTU need not match that ceiling.
  mtu: 4200
  # Lowercase PCI PF device ID, without 0x. Must match supportedExtraNICs.
  deviceID: "1760"
  nodes:
    bertha-xlarge-101:
      enabled: false
      rootDevices:
        - "0000:4a:00.0"
        - "0000:c8:00.0"
    bertha-xlarge-102:
      enabled: false
      rootDevices: []
    bertha-xlarge-105:
      # Control-plane node: activate separately after a worker is validated.
      enabled: false
      rootDevices: []
    bertha-xlarge-109:
      enabled: false
      rootDevices: []
